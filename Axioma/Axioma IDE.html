<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Axioma IDE</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.css">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #15171d;
  --bg-panel:  #1b1e26;
  --bg-raised: #21242e;
  --line:      #2c313d;
  --ink:       #e7e5df;
  --ink-dim:   #9196a3;
  --gold:      #d4a24e;
  --gold-dim:  #8a7247;
  --teal:      #5ec8c2;
  --red:       #e3685f;
  --radius: 3px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f4ef; --bg-panel: #fdfcf9; --bg-raised: #ffffff;
    --line: #ddd7c9; --ink: #1d1b16; --ink-dim: #6b6558;
    --gold: #9a6c1f; --gold-dim: #b68a3d; --teal: #2d7d77; --red: #b8392f;
  }
}
:root[data-theme="dark"] {
  --bg: #15171d; --bg-panel: #1b1e26; --bg-raised: #21242e;
  --line: #2c313d; --ink: #e7e5df; --ink-dim: #9196a3;
  --gold: #d4a24e; --gold-dim: #8a7247; --teal: #5ec8c2; --red: #e3685f;
}
* { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.app { display: flex; flex-direction: column; height: 100%; min-height: 100vh; }

header {
  display: flex; align-items: center; gap: 18px;
  padding: 14px 22px; border-bottom: 1px solid var(--line);
  background: var(--bg-panel); flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand .mark { font-family: 'Source Serif 4', serif; font-weight: 600; font-style: italic; font-size: 22px; color: var(--gold); letter-spacing: 0.3px; }
.brand .tag { font-size: 12px; color: var(--ink-dim); }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
button, select {
  font-family: inherit; font-size: 13px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--bg-raised); color: var(--ink);
  padding: 7px 13px; cursor: pointer; transition: border-color .15s, color .15s;
}
button:hover, select:hover { border-color: var(--gold-dim); }
button:active { transform: translateY(1px); }
button.primary { background: var(--gold); border-color: var(--gold); color: #1b1408; font-weight: 600; }
button.primary:hover { background: #e0b263; }
button.primary:disabled { opacity: 0.5; cursor: default; }
button.ghost { background: transparent; }
input[type=file] { display: none; }
.kbd { font-size: 10px; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; margin-left: 6px; }

main { flex: 1; display: flex; min-height: 0; }
.pane { flex: 1 1 50%; display: flex; flex-direction: column; min-width: 0; }
.pane + .pane { border-left: 1px solid var(--line); }
.pane-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; font-size: 11px; letter-spacing: .04em; color: var(--ink-dim);
  border-bottom: 1px solid var(--line); background: var(--bg-panel); flex-shrink: 0;
}
.pane-head .status { display:flex; align-items:center; gap:6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-dim); }
.dot.ok { background: var(--teal); }
.dot.err { background: var(--red); }
.dot.run { background: var(--gold); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

#editor-host { flex: 1; min-height: 0; }
.CodeMirror { height: 100%; font-family: 'JetBrains Mono', monospace; font-size: 14.5px; line-height: 1.6; background: var(--bg-panel); color: var(--ink); }
.CodeMirror-gutters { background: var(--bg-panel); border-right: 1px solid var(--line); }
.CodeMirror-linenumber { color: #4a4f5c; }
.CodeMirror-cursor { border-left: 2px solid var(--gold); }
.cm-ax-keyword { color: var(--gold); }
.cm-ax-struct { color: var(--gold); font-weight: 600; }
.cm-ax-string { color: var(--teal); }
.cm-ax-number { color: #c9a8e8; }
.cm-ax-comment { color: var(--ink-dim); font-style: italic; }
.cm-ax-op { color: #e7956b; }
.cm-ax-bool { color: #e7956b; font-weight: 600; }

#console {
  flex: 1; overflow-y: auto; padding: 14px 18px; font-size: 13.5px; line-height: 1.7;
  white-space: pre-wrap; word-break: break-word;
}
#console .line { padding: 1px 0; }
#console .err { color: var(--red); }
#console .err::before { content: "✗ "; }
#console .hint { color: var(--ink-dim); }
#console .welcome { color: var(--ink-dim); }

footer {
  padding: 7px 22px; border-top: 1px solid var(--line); background: var(--bg-panel);
  font-size: 11px; color: var(--ink-dim); display: flex; justify-content: space-between;
  padding-bottom: calc(7px + env(safe-area-inset-bottom, 0px));
}
footer a { color: var(--ink-dim); }

@media (max-width: 860px) {
  main { flex-direction: column; }
  .pane + .pane { border-left: none; border-top: 1px solid var(--line); }
  .pane { flex-basis: 50%; }
  .brand .tag { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="mark">Axioma</span><span class="tag">IDE — a mathematical programming language</span></div>
    <div class="toolbar">
      <select id="examples"></select>
      <button id="btn-run" class="primary">▶ Run<span class="kbd">⌘/Ctrl+Enter</span></button>
      <button id="btn-load" class="ghost">Open .axm</button>
      <input id="file-input" type="file" accept=".axm">
      <button id="btn-save" class="ghost">Save .axm</button>
      <button id="btn-theme" class="ghost" title="Switch theme">☾</button>
    </div>
  </header>
  <main>
    <section class="pane">
      <div class="pane-head"><span>EDITOR — program.axm</span><span id="pos">1:1</span></div>
      <div id="editor-host"></div>
    </section>
    <section class="pane">
      <div class="pane-head">
        <span>CONSOLE</span>
        <span class="status"><span id="status-dot" class="dot"></span><span id="status-text">ready</span></span>
      </div>
      <div id="console"><div class="line welcome">// Your Axioma program's output will appear here. Press "Run" to get started.</div></div>
    </section>
  </main>
  <footer>
    <span>Axioma engine — native JavaScript implementation, no external runtime dependencies.</span>
    <span>File extension: <code>.axm</code></span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/mode/simple.min.js"></script>
<script>
/* ====================== AXIOMA ENGINE (inlined) ====================== */
/* ============================================================================
   Axioma Engine — JavaScript port (lexer + parser + tree-walk interpreter)
   Mirrors the Python reference implementation (axioma_lexer.py /
   axioma_parser.py / interpreter.py) closely enough to share semantics,
   so this IDE runs *the* Axioma language natively in the browser with no
   external runtime dependency (no WASM/Pyodide fetch required).
   ============================================================================ */
(function (global) {
"use strict";

// ── Errors ──────────────────────────────────────────────────────────────────
class LexerError extends Error {
  constructor(msg, line, col) { super(`[Lexer] ${msg} at line ${line}, col ${col}`); this.line = line; this.col = col; }
}

// ── Keywords ────────────────────────────────────────────────────────────────
const KEYWORDS = new Set([
  "let","given","otherwise","each","repeat","until","in","stop","next","skip",
  "where","fn","report","structure","extends","create","this","parent",
  "static","property","fixed","immutable","check","catch","resolve","always",
  "abort","cause","fallback","using","from","provide","as","export","if","main",
  "spawn","collect","emit","expand","outer","scope","drop","verify",
  "assume","on_open","on_close","union","intersect","exclude","cart",
  "deriv","integ","sum","prod","nrt","by","begin","end","case",
  "out","type","is","inherits","Sequence","Tuple","Mapping","Set","FrozenSet",
  "ConstantSet","Binary","MutableBinary","ZZ","RR","CC","NN","QQ","II","ii",
  "Bool","CharSequence","Null","sup","inf","round","sort","reverse",
  "apply","select","fold","specialize","stream","load","store",
  "exists","identity","hash","inspect","doc","compute","run","get","set",
  "base","entity","method","sequence","is_function","stringify","format",
  "char","code","base2","base8","base16","indexed","combine","LexicalContext",
  "is_null","contains","forall","plot",
]);
const MATH_SETS = new Set(["NN","ZZ","QQ","II","RR","ii","CC"]);
const BOOL_LITERALS = new Set(["T","F"]);
const SOURCE_EXTENSION = ".axm";

// ── Lexer ───────────────────────────────────────────────────────────────────
class Token {
  constructor(type, value, line, col) { this.type = type; this.value = value; this.line = line; this.col = col; }
}

const SINGLE_CHAR = {
  "(": "LPAREN", ")": "RPAREN", "[": "LBRACKET", "]": "RBRACKET",
  "{": "LBRACE", "}": "RBRACE", ",": "COMMA", ";": "SEMICOLON",
  "#": "HASH", "'": "PRIME", "@": "AT", "?": "QUESTION",
  "^": "CARET", "~": "TILDE", "%": "PERCENT", "_": "UNDERSCORE",
};

class Lexer {
  constructor(src) { this.src = src; this.pos = 0; this.line = 1; this.col = 1; this.tokens = []; }
  current() { return this.pos < this.src.length ? this.src[this.pos] : null; }
  peek(o = 1) { const i = this.pos + o; return i < this.src.length ? this.src[i] : null; }
  advance() {
    const ch = this.src[this.pos]; this.pos++;
    if (ch === "\n") { this.line++; this.col = 1; } else { this.col++; }
    return ch;
  }
  match(expected) { if (this.current() === expected) { this.advance(); return true; } return false; }
  add(type, value, line, col) { this.tokens.push(new Token(type, value, line, col)); }
  here() { return [this.line, this.col]; }

  tokenize() {
    while (this.current() !== null) this._scan();
    this.add("EOF", null, this.line, this.col);
    return this.tokens;
  }

  _readWhile(cond) { let r = ""; while (this.current() !== null && cond(this.current())) r += this.advance(); return r; }
  _readUntilNewline() { return this._readWhile(c => c !== "\n"); }

  _readString(interp) {
    let r = "";
    for (;;) {
      const ch = this.current();
      if (ch === null) throw new LexerError("Unterminated string", this.line, this.col);
      if (ch === '"') { this.advance(); break; }
      if (ch === "\\") {
        this.advance(); const esc = this.advance();
        r += ({ n: "\n", t: "\t", "\\": "\\", '"': '"' })[esc] ?? esc;
      } else { r += this.advance(); }
    }
    return interp ? { interp: true, raw: r } : r;
  }

  _readNumber(first) {
    let digits = first + this._readWhile(c => /[0-9_]/.test(c));
    digits = digits.replace(/_/g, "");
    if (this.current() === "." && this.peek() !== ".") {
      this.advance();
      const frac = this._readWhile(c => /[0-9]/.test(c));
      return ["REAL", parseFloat(`${digits}.${frac || "0"}`)];
    }
    return ["INTEGER", parseInt(digits, 10)];
  }

  _emitIdentOrKeyword(word, line, col) {
    if (word === "Null") this.add("NULL", null, line, col);
    else if (BOOL_LITERALS.has(word)) this.add("BOOL", word === "T", line, col);
    else if (MATH_SETS.has(word)) this.add("MATHSET", word, line, col);
    else if (KEYWORDS.has(word)) this.add("KEYWORD", word, line, col);
    else this.add("IDENT", word, line, col);
  }

  _scan() {
    const [line, col] = this.here();
    const ch = this.advance();

    if (ch === " " || ch === "\t" || ch === "\r") return;
    if (ch === "\n") {
      if (!this.tokens.length || this.tokens[this.tokens.length - 1].type !== "NEWLINE") this.add("NEWLINE", "\n", line, col);
      return;
    }
    if (ch === "-") {
      if (this.current() === "-") { this.advance(); this._readUntilNewline(); return; } // comment
      if (this.match(">")) { this.add("ARROW", "->", line, col); return; }
      if (this.match("=")) { this.add("MINUSEQ", "-=", line, col); return; }
      this.add("MINUS", "-", line, col); return;
    }
    if (ch === '"') { this.add("STRING", this._readString(false), line, col); return; }
    if (ch === "s" && this.current() === '"') { this.advance(); this.add("STRING", this._readString(true), line, col); return; }
    if (/[0-9]/.test(ch)) { const [t, v] = this._readNumber(ch); this.add(t, v, line, col); return; }
    if (/[A-Za-z_]/.test(ch)) {
      const ident = ch + this._readWhile(c => /[A-Za-z0-9_]/.test(c));
      this._emitIdentOrKeyword(ident, line, col); return;
    }
    if (ch === "\u27e8") { this.add("LANGLE", ch, line, col); return; }
    if (ch === "\u27e9") { this.add("RANGLE", ch, line, col); return; }

    if (ch === ":") {
      if (this.match(":")) this.add("DOMAIN", "::", line, col);
      else if (this.match("=")) this.add("ASSIGN", ":=", line, col);
      else this.add("COLON", ":", line, col);
      return;
    }
    if (ch === "=") {
      if (this.current() === "=" && this.peek(1) === "=") { this.advance(); this.advance(); this.add("EQ", "===", line, col); }
      else if (this.current() === "!" && this.peek(1) === "=") { this.advance(); this.advance(); this.add("NEQ", "=!=", line, col); }
      else if (this.match(">")) this.add("FATARROW", "=>", line, col);
      else throw new LexerError("Unexpected '=' (did you mean ':=' or '==='?)", line, col);
      return;
    }
    if (ch === "!") { if (this.match("!")) this.add("NOT", "!!", line, col); else throw new LexerError("Single '!' is not valid — use '!!'", line, col); return; }
    if (ch === "&") { if (this.match("&")) this.add("AND", "&&", line, col); else this.add("AMPERSAND", "&", line, col); return; }
    if (ch === "|") { if (this.match("|")) this.add("OR", "||", line, col); else this.add("PIPE", "|", line, col); return; }
    if (ch === "<") { if (this.match("<")) this.add("LSHIFT", "<<", line, col); else if (this.match("=")) this.add("LTE", "<=", line, col); else this.add("LT", "<", line, col); return; }
    if (ch === ">") { if (this.match(">")) this.add("RSHIFT", ">>", line, col); else if (this.match("=")) this.add("GTE", ">=", line, col); else this.add("GT", ">", line, col); return; }
    if (ch === ".") {
      if (this.current() === "." && this.peek(1) === ".") { this.advance(); this.advance(); this.add("ELLIPSIS", "...", line, col); }
      else if (this.match(".")) this.add("DOTDOT", "..", line, col);
      else throw new LexerError("Lone '.' is not valid in Axioma", line, col);
      return;
    }
    if (ch === "*") { if (this.match("*")) this.add("STARSTAR", "**", line, col); else if (this.match("=")) this.add("STAREQ", "*=", line, col); else this.add("STAR", "*", line, col); return; }
    if (ch === "/") { if (this.match("/")) this.add("DOUBLESLASH", "//", line, col); else if (this.match("=")) this.add("SLASHEQ", "/=", line, col); else this.add("SLASH", "/", line, col); return; }
    if (ch === "+") { if (this.match("=")) this.add("PLUSEQ", "+=", line, col); else this.add("PLUS", "+", line, col); return; }
    if (ch in SINGLE_CHAR) { this.add(SINGLE_CHAR[ch], ch, line, col); return; }
    throw new LexerError(`Unexpected character ${JSON.stringify(ch)}`, line, col);
  }
}

global.AxiomaLexer = { Lexer, LexerError, KEYWORDS, SOURCE_EXTENSION };

})(typeof window !== "undefined" ? window : global);
/* Axioma Parser — JS port. Produces plain-object AST nodes: { kind, ...fields, line, col } */
(function (global) {
"use strict";

class ParseError extends Error {
  constructor(msg, tok) {
    super(`[Parser] ${msg} — got ${tok.type}(${JSON.stringify(tok.value)}) at ${tok.line}:${tok.col}`);
    this.token = tok;
  }
}

function N(kind, fields) { return Object.assign({ kind }, fields); }

const SET_OPS = new Set(["union", "intersect", "exclude", "cart"]);

class Parser {
  constructor(tokens) {
    this.tokens = tokens.filter(t => t.type !== "COMMENT");
    this.pos = 0;
  }
  current() { return this.tokens[this.pos]; }
  peek(o = 1) { const i = this.pos + o; return i < this.tokens.length ? this.tokens[i] : this.tokens[this.tokens.length - 1]; }
  advance() { const t = this.tokens[this.pos]; if (this.pos < this.tokens.length - 1) this.pos++; return t; }
  check(tt, value) { const t = this.current(); if (t.type !== tt) return false; return value === undefined || t.value === value; }
  match(tt, value) { if (this.check(tt, value)) return this.advance(); return null; }
  expect(tt, value) {
    if (this.check(tt, value)) return this.advance();
    const hint = value !== undefined ? `'${value}'` : tt;
    throw new ParseError(`Expected ${hint}`, this.current());
  }
  skipNewlines() { while (this.check("NEWLINE")) this.advance(); }
  isKw(...words) { const t = this.current(); return t.type === "KEYWORD" && words.includes(t.value); }
  expectKw(word) { if (this.isKw(word)) return this.advance(); throw new ParseError(`Expected keyword '${word}'`, this.current()); }
  expectFieldName() {
    const t = this.current();
    if (t.type === "IDENT" || t.type === "KEYWORD") { this.advance(); return t.value; }
    throw new ParseError("Expected a field name", t);
  }

  parse() {
    const stmts = [];
    this.skipNewlines();
    while (!this.check("EOF")) { stmts.push(this.parseStmt()); this.skipNewlines(); }
    return N("Program", { body: stmts });
  }

  parseStmt() {
    const start = this.current();
    const node = this._parseStmtInner();
    if (node.line === undefined) { node.line = start.line; node.col = start.col; }
    return node;
  }

  _parseStmtInner() {
    const t = this.current();
    if (t.type === "KEYWORD") {
      const v = t.value;
      if (v === "let") return this.parseVarDecl();
      if (v === "where") return this.parseFuncDef();
      if (v === "spawn") { this.advance(); return N("ExprStmt", { expr: N("SpawnExpr", { value: this.parseExpr() }) }); }
      if (v === "report") { this.advance(); return N("ReturnStmt", { value: this.parseExpr() }); }
      if (v === "each") return this.parseEach();
      if (v === "repeat") return this.parseRepeat();
      if (v === "given") return this.parseMatch();
      if (v === "check") return this.parseCheck();
      if (v === "abort") return this.parseAbort();
      if (v === "using") { this.advance(); this.parseExpr(); return N("UsingStmt", {}); }
      if (v === "from") { this.advance(); while (!this.check("NEWLINE") && !this.check("EOF")) this.advance(); return N("FromStmt", {}); }
      if (v === "structure") return this.parseStructure();
      if (v === "skip") { this.advance(); return N("SkipStmt", {}); }
      if (v === "stop") { this.advance(); return N("StopStmt", {}); }
      if (v === "next") { this.advance(); return N("NextStmt", {}); }
      if (v === "drop") { this.advance(); const name = this.expect("IDENT").value; return N("DropStmt", { name }); }
      if (v === "verify") { this.advance(); return N("VerifyStmt", { expr: this.parseExpr() }); }
      if (v === "emit") { this.advance(); return N("EmitStmt", { value: this.parseExpr() }); }
      if (v === "expand") { this.advance(); return N("ExpandStmt", { value: this.parseExpr() }); }
      if (v === "if") return this.parseIfMain();
      if (v === "export") { this.advance(); return this.parseStmt(); }
    }
    return this.parseExprStmt();
  }

  parseBlock() {
    this.expectKw("begin"); this.skipNewlines();
    const stmts = [];
    while (!this.isKw("end") && !this.check("EOF")) { stmts.push(this.parseStmt()); this.skipNewlines(); }
    this.expectKw("end");
    return N("Block", { stmts });
  }

  // ── let / if-chain ──────────────────────────────────────────────────────
  parseVarDecl() {
    this.expectKw("let");
    const t = this.current();
    const expr = this.parseExpr();
    if (this.isKw("begin")) return this._finishIfStmt(expr);
    if (expr.kind !== "Identifier") throw new ParseError("Expected variable name after 'let'", t);
    const name = expr.name;
    let typeHint = null, domain = null;
    if (this.match("DOMAIN")) {
      domain = this._readType();
      if (!this.check("ASSIGN")) return N("VarDecl", { name, typeHint, domain, value: null });
    } else if (this.match("COLON")) {
      typeHint = this._readType();
    }
    if (this.match("ASSIGN")) return N("VarDecl", { name, typeHint, domain, value: this.parseExpr() });
    for (const [tt, op] of [["PLUSEQ", "+="], ["MINUSEQ", "-="], ["STAREQ", "*="], ["SLASHEQ", "/="]]) {
      if (this.match(tt)) return N("Assign", { target: N("Identifier", { name }), op, value: this.parseExpr() });
    }
    return N("VarDecl", { name, typeHint, domain, value: null });
  }

  _readType() {
    const t = this.current();
    if (t.type === "KEYWORD" || t.type === "MATHSET" || t.type === "IDENT") { this.advance(); return t.value; }
    throw new ParseError("Expected type name", t);
  }

  _finishIfStmt(firstCond) {
    const branches = [];
    let body = this.parseBlock();
    branches.push([firstCond, body]); this.skipNewlines();
    while (this.isKw("given")) {
      this.advance(); const cond = this.parseExpr(); body = this.parseBlock();
      branches.push([cond, body]); this.skipNewlines();
    }
    let otherwise = null;
    if (this.isKw("otherwise")) { this.advance(); otherwise = this.parseBlock(); }
    return N("IfStmt", { branches, otherwise });
  }

  // ── function def ────────────────────────────────────────────────────────
  parseFuncDef(isSpawn = false) {
    this.expectKw("where");
    const name = this.expect("IDENT").value;
    this.expect("LPAREN");
    const params = this._parseParams();
    this.expect("RPAREN");

  category: "Advanced (ADTs, nodes, errors)", label: "Fibonacci and lambdas",
  src: `where fib(n) begin
  given n < 2:
    case T -> report n
  report fib(n - 1) + fib(n - 2)
end

each i in {0..9} begin
  out(s"fib({i}) = {fib(i)}")
end

let doubled := apply(fn(x) => x * 2, [1, 2, 3, 4, 5])
out(doubled)

let evens := [x | x in {1..10}, x % 2 === 0]
out(evens)
`
},
];
const BASIC_EXAMPLES = [
{
  category: "Basics", label: "Hello World",
  src: `-- Your first Axioma program
out("Hello, Axioma!")
`
},
{
  category: "Basics", label: "Variables and types",
  src: `-- 'let' declares a variable. ':=' assigns a value.
let x := 10
let pi : RR := 3.14159
let name := "Axioma"

out(x)
out(pi)
out(name)

-- Compound assignment operators
x += 5
out(x)   -- 15
`
},
{
  category: "Basics", label: "Arithmetic operators",
  src: `let a := 17
let b := 3

out(a + b)    -- addition: 20
out(a - b)    -- subtraction: 14
out(a * b)    -- multiplication: 51
out(a / b)    -- division: 5.666...
out(a // b)   -- integer division: 5
out(a % b)    -- modulo: 2
out(a ** 2)   -- power: 289
`
},
{
  category: "Basics", label: "Conditionals (let / given / otherwise)",
  src: `-- Axioma doesn't use 'if': it uses 'let <condition> begin ... end'
let age := 20

let age >= 18 begin
  out("you're an adult")
end given age >= 13 begin
  out("you're a teenager")
end otherwise begin
  out("you're a child")
end
`
},
{
  category: "Basics", label: "each loop (iterate over a sequence)",
  src: `each i in {1..5} begin
  out(s"i = {i}")
end

-- also works over lists
each fruit in ["apple", "pear", "grape"] begin
  out(fruit)
end
`
},
{
  category: "Basics", label: "repeat...until loop",
  src: `let counter := 0

repeat begin
  out(s"counter = {counter}")
  counter += 1
end until counter === 5
`
},
{
  category: "Basics", label: "Pattern matching (given/case)",
  src: `where describe(n) begin
  given n:
    case 0 -> report "zero"
    case 1 -> report "one"
    case 2 -> report "two"
    otherwise -> report "many"
end

each n in {0..3} begin
  out(describe(n))
end
`
},
{
  category: "Basics", label: "Functions (where)",
  src: `where rectangle_area(width, height) begin
  report width * height
end

where greet(name := "friend") begin
  -- parameters can have a default value
  report s"Hello, {name}!"
end

out(rectangle_area(4, 5))
out(greet())
out(greet("Mothie"))
`
},
{
  category: "Basics", label: "Lambdas and apply/select/fold",
  src: `let double := fn(x) => x * 2
let is_even := fn(x) => x % 2 === 0

let numbers := [1, 2, 3, 4, 5, 6]

out(apply(double, numbers))       -- applies to each element
out(select(is_even, numbers))     -- filters
out(fold(fn(a, b) => a + b, 0, numbers))  -- total sum
`
},
{
  category: "Basics", label: "Lists, sets, and maps",
  src: `let list := [1, 2, 3]
let set := {1, 2, 2, 3}            -- duplicates are ignored
let map := {"name": "Axioma", "version": 1}

out(list)
out(set)
out(map)
out(#list)                -- length: 3
out(list + [4, 5])        -- concatenate: [1,2,3,4,5]
out(map["name"])          -- access by key

-- list comprehension
let squares := [x * x | x in {1..5}]
out(squares)
`
},
];
window.__AXIOMA_EXAMPLES__ = BASIC_EXAMPLES.concat(window.__AXIOMA_EXAMPLES__);

</script>
<script>
/* ====================== IDE UI ====================== */
(function () {
  "use strict";
  const { Interpreter, AxiomaError } = window.AxiomaInterpreter;
  const { LexerError } = window.AxiomaLexer;
  const { ParseError } = window.AxiomaParser;

  // ---- CodeMirror "simple mode" for Axioma -----------------------------
  const KW = [...window.AxiomaLexer.KEYWORDS];
  const STRUCT_WORDS = ["structure", "where", "let", "create"];
  CodeMirror.defineSimpleMode("axioma", {
    start: [
      { regex: /--.*/, token: "ax-comment" },
      { regex: /s?"(?:[^"\\]|\\.)*"/, token: "ax-string" },
      { regex: /\b(T|F|Null)\b/, token: "ax-bool" },
      { regex: /\b\d+(\.\d+)?\b/, token: "ax-number" },
      { regex: /\b(structure|where|create|let)\b/, token: "ax-struct" },
      { regex: new RegExp("\\b(" + KW.filter(k => !STRUCT_WORDS.includes(k)).join("|") + ")\\b"), token: "ax-keyword" },
      { regex: /(:=|->|=>|===|=!=|<=|>=|&&|\|\||!!|\*\*|\/\/|\+=|-=|\*=|\/=|::)/, token: "ax-op" },
      { regex: /['#@?]/, token: "ax-op" },
    ],
  });

  // ---- Editor ------------------------------------------------------------
  const DEFAULT_SRC = `-- Welcome to Axioma
-- Linked list: a minimal ADT (Abstract Data Type) example

structure Node :=
  property value
  property next := Null

  create(v) begin
    this'value := v
  end
end

let head := Node(1)
head'next := Node(2)
head'next'next := Node(3)

let cur := head
repeat begin
  out(cur'value)
  cur := cur'next
end until is_null(cur)
`;

  const cm = CodeMirror(document.getElementById("editor-host"), {
    value: DEFAULT_SRC,
    mode: "axioma",
    theme: "default",
    lineNumbers: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    viewportMargin: Infinity,
    extraKeys: { "Ctrl-Enter": run, "Cmd-Enter": run, "Tab": (cm) => cm.replaceSelection("  ") },
  });
  cm.on("cursorActivity", () => {
    const c = cm.getCursor();
    document.getElementById("pos").textContent = `${c.line + 1}:${c.ch + 1}`;
  });

  // ---- Console -------------------------------------------------------
  const consoleEl = document.getElementById("console");
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  function clearConsole() { consoleEl.innerHTML = ""; }
  function printLine(text, cls) {
    const div = document.createElement("div");
    div.className = "line" + (cls ? " " + cls : "");
    div.textContent = text;
    consoleEl.appendChild(div);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }
  function setStatus(mode, label) {
    statusDot.className = "dot" + (mode ? " " + mode : "");
    statusText.textContent = label;
  }

  // ---- Run -------------------------------------------------------------
  const runBtn = document.getElementById("btn-run");
  function run() {
    const src = cm.getValue();
    clearConsole();
    setStatus("run", "running…");
    runBtn.disabled = true;
    // Let the UI paint "running…" before the (synchronous) run blocks the thread.
    setTimeout(() => {
      const t0 = performance.now();
      try {
        const interp = new Interpreter({ out: (s) => printLine(s) });
        interp.run(src);
        const ms = (performance.now() - t0).toFixed(1);
        setStatus("ok", `done in ${ms} ms`);
      } catch (e) {
        if (e instanceof LexerError || e instanceof ParseError) {
          printLine(e.message, "err");
        } else if (e instanceof AxiomaError) {
          printLine(e.toString(), "err");
        } else {
          printLine(`Internal error: ${e.message || e}`, "err");
        }
        setStatus("err", "error");
      } finally {
        runBtn.disabled = false;
      }
    }, 10);
  }
  runBtn.addEventListener("click", run);

  // ---- Load / Save .axm --------------------------------------------
  const fileInput = document.getElementById("file-input");
  document.getElementById("btn-load").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if (!f) return;
    if (!f.name.endsWith(".axm")) {
      printLine(`"${f.name}" does not have the .axm extension — Axioma expects .axm files.`, "err");
      fileInput.value = ""; return;
    }
    const reader = new FileReader();
    reader.onload = () => { cm.setValue(reader.result); printLine(`Loaded: ${f.name}`, "hint"); };
    reader.readAsText(f);
    fileInput.value = "";
  });
  document.getElementById("btn-save").addEventListener("click", () => {
    const blob = new Blob([cm.getValue()], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "programa.axm";
    document.body.appendChild(a); a.click(); a.remove();
  });

  // ---- Theme toggle ------------------------------------------------
  const themeBtn = document.getElementById("btn-theme");
  themeBtn.addEventListener("click", () => {
    const root = document.documentElement;
    const cur = root.getAttribute("data-theme");
    if (cur === "dark") { root.setAttribute("data-theme", "light"); themeBtn.textContent = "☀"; }
    else { root.setAttribute("data-theme", "dark"); themeBtn.textContent = "☾"; }
  });

  // ---- Examples ------------------------------------------------------
  const EXAMPLES = window.__AXIOMA_EXAMPLES__;
  const sel = document.getElementById("examples");
  const optDefault = document.createElement("option");
  optDefault.textContent = "Examples…"; optDefault.value = "";
  sel.appendChild(optDefault);
  const groups = {};
  EXAMPLES.forEach((ex, i) => {
    const cat = ex.category || "Examples";
    if (!groups[cat]) { groups[cat] = document.createElement("optgroup"); groups[cat].label = cat; sel.appendChild(groups[cat]); }
    const opt = document.createElement("option");
    opt.value = i; opt.textContent = ex.label;
    groups[cat].appendChild(opt);
  });
  sel.addEventListener("change", () => {
    if (sel.value === "") return;
    cm.setValue(EXAMPLES[+sel.value].src);
    sel.value = "";
  });

  printLine("Axioma IDE ready. Press Run or " + (navigator.platform.includes("Mac") ? "⌘" : "Ctrl") + "+Enter.", "hint");
})();
</script>
</body>
